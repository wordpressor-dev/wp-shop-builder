name: Apply temporary technical type override patch

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0

      - name: Apply technical type override patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/technical-type-override.part* > /tmp/technical-type-override.patch
          git apply --check /tmp/technical-type-override.patch
          git apply /tmp/technical-type-override.patch
          rm .github/technical-type-override.part*
          rm .github/workflows/apply-technical-type-override.yml
          php -l apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php
          php -l apps/Plugin/Admin/ProductEditorialMigrationPage.php
          php -l tests/App/Plugin/ProductManager/Editorial/ProductTechnicalTypeOverrideTest.php
          git config user.name 'wordpressor-dev'
          git config user.email 'serghei.colos@gmail.com'
          git add -A
          git commit -m 'feat: add safe technical type override'
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
