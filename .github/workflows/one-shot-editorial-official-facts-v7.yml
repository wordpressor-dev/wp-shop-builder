name: One-shot editorial official facts v7

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-editorial-official-facts-v7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0
      - name: Preserve official fact feature lists
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php')
          s = p.read_text()
          old = "                '/^(?:включает|включены|созда[её]т|добавляет|поддерживает|предлагает|содержит|'\n                    . 'includes|creates|generates|adds|supports|offers|contains|features)\\b/ui'"
          new = "                '/^(?:включает|включены|созда[её]т|добавляет|поддерживает|предлагает|содержит|'\n                    . 'интеграция\\s+с|совместимость\\s+с|поддержка(?:\\s+для)?|'\n                    . 'includes|creates|generates|adds|supports|offers|contains|features|'\n                    . 'integration\\s+with|compatibility\\s+with|support\\s+for)\\b/ui'"
          if old not in s:
              raise SystemExit('explicit list regex anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          php -l apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php
          git commit -m "fix: preserve official integration facts in feature lists"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
