name: One-shot audience extraction fix

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-audience-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0

      - name: Patch audience extraction and add regression tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php')
          source = path.read_text()
          old = r'''    private function audienceFromRuSummary(string $summary): string
              {
                  if (preg_match('/\bдля\s+([^.!?]+)/ui', $summary, $matches) !== 1) {
                      return '';
                  }

                  return trim((string) $matches[1]);
              }

              private function audienceFromEnSummary(string $summary): string
              {
                  if (preg_match('/\bfor\s+([^.!?]+)/ui', $summary, $matches) !== 1) {
                      return '';
                  }

                  return trim((string) $matches[1]);
              }
          '''
          new = r'''    private function audienceFromRuSummary(string $summary): string
              {
                  $explicit = [
                      '/\b(?:идеал(?:ен|ьна|ьно|ьны)|подходит|подойд[её]т|предназначен(?:а|о|ы)?|ориентирован(?:а|о|ы)?)\s+для\s+([^.!?]+)/ui',
                  ];

                  foreach ($explicit as $pattern) {
                      if (preg_match($pattern, $summary, $matches) !== 1) {
                          continue;
                      }

                      $candidate = trim((string) ($matches[1] ?? ''));
                      if ($this->isRuAudienceCandidate($candidate)) {
                          return $candidate;
                      }
                  }

                  if (preg_match_all('/\bдля\s+([^.!?]+)/ui', $summary, $matches) !== false) {
                      foreach ((array) ($matches[1] ?? []) as $match) {
                          $candidate = trim((string) $match);
                          if ($this->isRuAudienceCandidate($candidate)) {
                              return $candidate;
                          }
                      }
                  }

                  return '';
              }

              private function audienceFromEnSummary(string $summary): string
              {
                  $explicit = [
                      '/\b(?:ideal|suitable|designed|built|intended|best\s+suited)\s+for\s+([^.!?]+)/ui',
                  ];

                  foreach ($explicit as $pattern) {
                      if (preg_match($pattern, $summary, $matches) !== 1) {
                          continue;
                      }

                      $candidate = trim((string) ($matches[1] ?? ''));
                      if ($this->isEnAudienceCandidate($candidate)) {
                          return $candidate;
                      }
                  }

                  if (preg_match_all('/\bfor\s+([^.!?]+)/ui', $summary, $matches) !== false) {
                      foreach ((array) ($matches[1] ?? []) as $match) {
                          $candidate = trim((string) $match);
                          if ($this->isEnAudienceCandidate($candidate)) {
                              return $candidate;
                          }
                      }
                  }

                  return '';
              }

              private function isRuAudienceCandidate(string $candidate): bool
              {
                  if ($candidate === '') {
                      return false;
                  }

                  if ($this->matches(
                      $candidate,
                      '/^(?:wordpress|woocommerce|elementor|wpml|rtl)\b'
                          . '|^(?:создани|оптимизац|продвижени|сброс|настройк|управлен|защит|перевод|интеграц|работ|улучшени|добавлен|отображен|построен|восстановлен|сканирован|автоматизац)[а-яё]*\b/ui'
                  )) {
                      return false;
                  }

                  return $this->matches(
                      $candidate,
                      '/(?:пользовател|разработчик|тестировщик|дизайнер|маркетолог|агентств|компан|команд|бизнес|бренд|магазин|салон|спа|spa|ресторан|кафе|отел|гостиниц|школ|университет|преподавател|тренер|студи|фриланс|блогер|фотограф|клиент)/ui'
                  );
              }

              private function isEnAudienceCandidate(string $candidate): bool
              {
                  if ($candidate === '') {
                      return false;
                  }

                  if ($this->matches(
                      $candidate,
                      '/^(?:wordpress|woocommerce|elementor|wpml|rtl)\b'
                          . '|^(?:creating|building|optimizing|optimization|promoting|promotion|resetting|reset|configuring|configuration|managing|management|protecting|protection|translating|translation|integrating|integration|improving|adding|displaying|restoring|scanning|automation)\b/ui'
                  )) {
                      return false;
                  }

                  return $this->matches(
                      $candidate,
                      '/(?:users?|developers?|testers?|designers?|marketers?|agencies|companies|teams|business(?:es)?|brands?|stores?|shops?|salons?|spas?|restaurants?|cafes?|hotels?|schools?|universities|instructors?|coaches|studios?|freelancers?|bloggers?|photographers?|clients?)/ui'
                  );
              }
          '''

          if old not in source:
              raise SystemExit('Audience extraction source block not found')
          path.write_text(source.replace(old, new))

          test = Path('tests/App/Plugin/ProductManager/Editorial/ProductEditorialAudienceExtractionTest.php')
          test.write_text(textwrap.dedent(r'''<?php

          declare(strict_types=1);

          namespace WPShop\Tests\App\Plugin\ProductManager\Editorial;

          use PHPUnit\Framework\TestCase;
          use WPShop\App\Plugin\ProductManager\CatalogProductType;
          use WPShop\App\Plugin\ProductManager\Editorial\ProductEditorialDraftBuilder;

          final class ProductEditorialAudienceExtractionTest extends TestCase
          {
              public function testUsesExplicitDeveloperAudienceInsteadOfFunctionalForPhrase(): void
              {
                  $builder = new ProductEditorialDraftBuilder();
                  $ru = 'WP Reset PRO — профессиональный плагин для быстрого сброса базы данных '
                      . 'WordPress к исходным настройкам. Идеален для разработчиков и тестировщиков.';
                  $en = 'WP Reset PRO is a professional plugin for quickly resetting the WordPress '
                      . 'database. Ideal for developers and testers.';

                  $content = $builder->build(
                      'WP Reset PRO - WordPress Development Tool for Non-Devs',
                      'WebFactory Ltd',
                      CatalogProductType::PLUGIN,
                      [],
                      '',
                      ['ruShort' => $ru, 'ruLong' => $ru, 'enShort' => $en, 'enLong' => $en]
                  );

                  self::assertStringContainsString(
                      'WP Reset PRO подходит для разработчиков и тестировщиков.',
                      $content['ruLong']
                  );
                  self::assertStringContainsString(
                      'WP Reset PRO is suitable for developers and testers.',
                      $content['enLong']
                  );
                  self::assertStringNotContainsString(
                      'подходит для быстрого сброса базы данных',
                      $content['ruLong']
                  );
              }

              public function testRejectsPlatformAndFunctionalPurposeAsAudience(): void
              {
                  $builder = new ProductEditorialDraftBuilder();

                  foreach ([
                      [
                          'SecuPress Pro with Simple SSL – Simple and Performance Security',
                          'SecuPress Pro — комплексный плагин безопасности для WordPress.',
                          'SecuPress Pro is a security plugin for WordPress.',
                      ],
                      [
                          'Advanced Custom Fields PRO',
                          'Advanced Custom Fields PRO — плагин для создания произвольных полей в WordPress.',
                          'Advanced Custom Fields PRO is a plugin for creating custom fields in WordPress.',
                      ],
                      [
                          'Yoast News SEO',
                          'Yoast News SEO — плагин для оптимизации новостного сайта под Google News.',
                          'Yoast News SEO is a plugin for optimizing news sites for Google News.',
                      ],
                  ] as [$title, $ru, $en]) {
                      $content = $builder->build(
                          $title,
                          '',
                          CatalogProductType::PLUGIN,
                          [],
                          '',
                          ['ruShort' => $ru, 'ruLong' => $ru, 'enShort' => $en, 'enLong' => $en]
                      );

                      self::assertStringContainsString(
                          'подойдёт пользователям, которым нужен плагин WordPress',
                          $content['ruLong']
                      );
                      self::assertStringContainsString(
                          'is suitable for users who need a WordPress plugin',
                          $content['enLong']
                      );
                  }
              }

              public function testKeepsRealAudienceFromThemeSummary(): void
              {
                  $builder = new ProductEditorialDraftBuilder();
                  $ru = 'Lirena — элегантная тема WordPress для салонов красоты и спа.';
                  $en = 'Lirena is an elegant WordPress theme for beauty salons and spas.';

                  $content = $builder->build(
                      'Lirena - Beauty and Spa Salon WordPress Theme',
                      'GT3themes',
                      CatalogProductType::THEME,
                      [],
                      '',
                      ['ruShort' => $ru, 'ruLong' => $ru, 'enShort' => $en, 'enLong' => $en]
                  );

                  self::assertStringContainsString(
                      'Lirena подходит для салонов красоты и спа.',
                      $content['ruLong']
                  );
                  self::assertStringContainsString(
                      'Lirena is suitable for beauty salons and spas.',
                      $content['enLong']
                  );
              }
          }
          '''))
          PY

          git rm .github/workflows/one-shot-audience-fix.yml
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php tests/App/Plugin/ProductManager/Editorial/ProductEditorialAudienceExtractionTest.php
          git commit -m "fix: distinguish audience from functional purpose"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
