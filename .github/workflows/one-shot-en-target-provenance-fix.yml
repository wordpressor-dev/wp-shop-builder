name: One-shot EN target provenance fix

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-en-target-provenance-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0

      - name: Patch stale prepared EN handling and add regression test
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          service = Path('apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php')
          source = service.read_text()

          old = """    private const MIGRATED_AT_META = '_wp_shop_editorial_migrated_at';\n"""
          new = old + "    private const EN_TARGET_RU_FINGERPRINT_META = '_wp_shop_en_target_ru_fingerprint';\n"
          if old not in source:
              raise SystemExit('service constants anchor not found')
          source = source.replace(old, new, 1)

          old = """            $generated = $this->preserveRichLegacyRu($legacy, $generated);\n        }\n\n        $translationIssue = $this->translationIssue($generated);\n"""
          new = """            $generated = $this->preserveRichLegacyRu($legacy, $generated);\n        }\n\n        if ($this->preparedEnglishIsStale($productId, $current, $generated)) {\n            $generated['enShort'] = '';\n            $generated['enLong'] = '';\n            $generated['enMeta'] = '';\n        }\n\n        $translationIssue = $this->translationIssue($generated);\n"""
          if old not in source:
              raise SystemExit('preview stale EN anchor not found')
          source = source.replace(old, new, 1)

          old = """        ($this->call)('delete_post_meta', $productId, self::MIGRATED_AT_META);\n\n        return [\n"""
          new = """        ($this->call)('delete_post_meta', $productId, self::MIGRATED_AT_META);\n        ($this->call)('delete_post_meta', $productId, self::EN_TARGET_RU_FINGERPRINT_META);\n\n        return [\n"""
          if old not in source:
              raise SystemExit('restore anchor not found')
          source = source.replace(old, new, 1)

          old = """    /** @param array<string,mixed> $legacy */\n    private function requiresEnglishTranslation(array $legacy): bool\n"""
          new = r'''    /**
     * Imported EN Pack v2 content belongs to one exact Generated v28 RU target.
     * If that RU target changes later, never preserve the old prepared EN as if
     * it were still current. Legacy packs created before provenance tracking are
     * recognized conservatively by the exact v28 editorial heading pattern.
     *
     * @param array{ruShort:string,ruLong:string,ruMeta:string,enShort:string,enLong:string,enMeta:string} $current
     * @param array{ruShort:string,ruLong:string,ruMeta:string,enShort:string,enLong:string,enMeta:string} $generated
     */
    private function preparedEnglishIsStale(
        int $productId,
        array $current,
        array $generated
    ): bool {
        $preparedFingerprint = trim($this->meta(
            $productId,
            self::EN_TARGET_RU_FINGERPRINT_META
        ));
        $targetFingerprint = $this->ruFingerprint($generated);

        if ($preparedFingerprint !== '') {
            return ! hash_equals($preparedFingerprint, $targetFingerprint);
        }

        if ($this->sameList(
            [$current['ruShort'], $current['ruLong'], $current['ruMeta']],
            [$generated['ruShort'], $generated['ruLong'], $generated['ruMeta']]
        )) {
            return false;
        }

        return $this->looksLikeGeneratedV28English($current['enLong']);
    }

    /**
     * @param array{ruShort:string,ruLong:string,ruMeta:string,enShort:string,enLong:string,enMeta:string} $content
     */
    private function ruFingerprint(array $content): string
    {
        return hash(
            'sha256',
            $content['ruShort'] . "\0" . $content['ruLong'] . "\0" . $content['ruMeta']
        );
    }

    private function looksLikeGeneratedV28English(string $content): bool
    {
        return preg_match('/<h3>Who is .+ for\?<\/h3>/i', $content) === 1
            && str_contains($content, '<h3>Use cases</h3>')
            && str_contains($content, 'Practical workflows depend on the capabilities');
    }

    /** @param array<string,mixed> $legacy */
    private function requiresEnglishTranslation(array $legacy): bool
'''
          if old not in source:
              raise SystemExit('service method insertion anchor not found')
          source = source.replace(old, new, 1)
          service.write_text(source)

          page = Path('apps/Plugin/Admin/ProductEditorialMigrationPage.php')
          source = page.read_text()

          old = """            $prepared[] = ['id' => $id, 'short' => $enShort, 'long' => $enLong, 'meta' => $enMeta];\n"""
          new = """            $prepared[] = [\n                'id' => $id,\n                'short' => $enShort,\n                'long' => $enLong,\n                'meta' => $enMeta,\n                'targetFingerprint' => $this->fingerprint($target),\n            ];\n"""
          if old not in source:
              raise SystemExit('prepared row anchor not found')
          source = source.replace(old, new, 1)

          old = """            ($this->call)('update_post_meta', $id, '_wp_shop_en_meta_description',\n                (string) ($this->call)('sanitize_textarea_field', $item['meta']));\n            $post = $this->previewForPack($id);\n"""
          new = """            ($this->call)('update_post_meta', $id, '_wp_shop_en_meta_description',\n                (string) ($this->call)('sanitize_textarea_field', $item['meta']));\n            ($this->call)(\n                'update_post_meta',\n                $id,\n                '_wp_shop_en_target_ru_fingerprint',\n                $item['targetFingerprint']\n            );\n            $post = $this->previewForPack($id);\n"""
          if old not in source:
              raise SystemExit('import write anchor not found')
          source = source.replace(old, new, 1)
          page.write_text(source)

          test = Path('tests/App/Plugin/ProductManager/Editorial/ProductEditorialPreparedEnglishStalenessTest.php')
          test.write_text(textwrap.dedent(r'''<?php

          declare(strict_types=1);

          namespace WPShop\Tests\App\Plugin\ProductManager\Editorial;

          use PHPUnit\Framework\TestCase;
          use WPShop\App\Plugin\ProductManager\Editorial\ProductEditorialMigrationService;

          final class ProductEditorialPreparedEnglishStalenessTest extends TestCase
          {
              public function testLegacyV2PreparedEnglishIsInvalidatedWhenRuTargetChanges(): void
              {
                  $ruShort = 'WP Reset PRO — профессиональный плагин для быстрого сброса базы данных '
                      . 'WordPress к исходным настройкам. Идеален для разработчиков и тестировщиков.';
                  $staleEnLong = '<h2>WP Reset PRO</h2>'
                      . '<p>WP Reset PRO is a professional plugin for quickly resetting WordPress. '
                      . 'Ideal for developers and testers.</p>'
                      . '<p>WP Reset PRO is a WordPress plugin. Its main capabilities and practical '
                      . 'use cases are summarized below.</p>'
                      . '<h3>Use cases</h3><p>WP Reset PRO extends WordPress with focused functionality. '
                      . 'Practical workflows depend on the capabilities listed in the plugin description.</p>'
                      . '<h3>Who is WP Reset PRO for?</h3>'
                      . '<p>WP Reset PRO is suitable for quickly resetting a WordPress database.</p>';

                  $post = [
                      'ID' => 2956,
                      'post_type' => 'product',
                      'post_title' => 'WP Reset PRO - WordPress Development Tool for Non-Devs 6.18',
                      'post_excerpt' => '<strong>WP Reset PRO</strong> — ' . $ruShort,
                      'post_content' => '<strong>WP Reset PRO</strong> — ' . $ruShort,
                  ];
                  $meta = [
                      'attr_version_value' => '6.18',
                      '_wp_shop_product_type' => 'plugin',
                      'attr_developer_value' => 'WebFactory Ltd',
                      '_wp_shop_source_update_date' => '',
                      '_wp_shop_en_short_description' => '<p>WP Reset PRO is a professional plugin. '
                          . 'Ideal for developers and testers.</p>',
                      '_wp_shop_en_long_description' => $staleEnLong,
                      '_wp_shop_en_meta_description' => 'Professional WordPress reset plugin for developers and testers.',
                      'surerank_settings_general' => [
                          'page_description' => 'Профессиональный плагин для быстрого сброса базы данных WordPress.',
                      ],
                  ];

                  $service = new ProductEditorialMigrationService($this->caller($post, $meta));
                  $preview = $service->preview(2956);

                  self::assertSame('STOP', $preview['status']);
                  self::assertSame('REVIEW', $preview['enStatus']);
                  self::assertSame('', $preview['generated']['enShort']);
                  self::assertSame('', $preview['generated']['enLong']);
                  self::assertSame('', $preview['generated']['enMeta']);
                  self::assertStringContainsString(
                      'подходит для разработчиков и тестировщиков',
                      $preview['generated']['ruLong']
                  );
              }

              /**
               * @param array<string,mixed> $post
               * @param array<string,mixed> $meta
               * @return \Closure(string,mixed...): mixed
               */
              private function caller(array &$post, array &$meta): \Closure
              {
                  return static function (
                      string $name,
                      mixed ...$arguments
                  ) use (
                      &$post,
                      &$meta
                  ): mixed {
                      if ($name === 'get_post') {
                          return (object) $post;
                      }

                      if ($name === 'get_post_meta') {
                          return $meta[(string) $arguments[1]] ?? '';
                      }

                      if ($name === 'wp_get_post_terms') {
                          return [];
                      }

                      if ($name === 'current_time') {
                          return '2026-08-31 12:00:00';
                      }

                      return null;
                  };
              }
          }
          '''))
          PY

          git rm .github/workflows/one-shot-en-target-provenance-fix.yml
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php apps/Plugin/Admin/ProductEditorialMigrationPage.php tests/App/Plugin/ProductManager/Editorial/ProductEditorialPreparedEnglishStalenessTest.php
          git commit -m "fix: invalidate stale prepared English after RU target changes"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
