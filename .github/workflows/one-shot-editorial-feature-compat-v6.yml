name: One-shot editorial feature compatibility v6

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-editorial-feature-compat-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0
      - name: Patch feature extraction compatibility
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php')
          s = p.read_text()

          old = "        if ($skipFirstSentence && $sentences !== []) {\n            array_shift($sentences);\n        }"
          new = "        if ($skipFirstSentence && count($sentences) > 1) {\n            array_shift($sentences);\n        }"
          if old not in s:
              raise SystemExit('skip anchor missing')
          s = s.replace(old, new, 1)

          old = "            $explicitList = $this->matches(\n                $sentence,\n                '/^(?:включает|включены|добавляет|поддерживает|предлагает|содержит|'\n                    . 'includes|adds|supports|offers|contains|features)\\b/ui'\n            );\n            $separator = $explicitList ? '/\\s*[,;]\\s*/u' : '/\\s*;\\s*/u';"
          new = "            $explicitList = $this->matches(\n                $sentence,\n                '/^(?:включает|включены|созда[её]т|добавляет|поддерживает|предлагает|содержит|'\n                    . 'includes|creates|generates|adds|supports|offers|contains|features)\\b/ui'\n            );\n            $denseCommaList = substr_count($sentence, ',') >= 3\n                && ! $this->matches(\n                    $sentence,\n                    '/\\b(?:является|представляет|позволяет|помогает|подходит|ориентирован|'\n                        . 'is|allows|helps|suitable|designed)\\b/ui'\n                );\n            $separator = ($explicitList || $denseCommaList)\n                ? '/\\s*[,;]\\s*/u'\n                : '/\\s*;\\s*/u';"
          if old not in s:
              raise SystemExit('list anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          php -l apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/ProductManager/Editorial/ProductEditorialDraftBuilder.php
          git commit -m "fix: preserve safe legacy feature lists"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
