name: One-shot paged editorial audit CSV

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-editorial-audit-page.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0
      - name: Patch editorial audit page
        run: python .github/scripts/patch_editorial_audit.py
      - name: Verify syntax
        run: php -l apps/Plugin/Admin/ProductEditorialMigrationPage.php
      - name: Commit patch
        run: |
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/Admin/ProductEditorialMigrationPage.php
          git commit -m "feat: add safe paged editorial audit CSV"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
