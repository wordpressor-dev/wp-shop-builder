name: One-shot EN target provenance v2 fix

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration
    paths:
      - .github/workflows/one-shot-en-target-provenance-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0

      - name: Patch EN provenance and add regression test
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap

          sp = Path('apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php')
          s = sp.read_text()
          if 'EN_TARGET_RU_FINGERPRINT_META' not in s:
              s = s.replace(
                  "    private const MIGRATED_AT_META = '_wp_shop_editorial_migrated_at';\n",
                  "    private const MIGRATED_AT_META = '_wp_shop_editorial_migrated_at';\n"
                  "    private const EN_TARGET_RU_FINGERPRINT_META = '_wp_shop_en_target_ru_fingerprint_v2';\n"
                  "    private const EN_CONTENT_FINGERPRINT_META = '_wp_shop_en_content_fingerprint_v2';\n",
                  1,
              )

          stale_block = r'''        $stalePreparedEnglish = false;
              $preparedTargetFingerprint = $this->meta($productId, self::EN_TARGET_RU_FINGERPRINT_META);
              $preparedEnglishFingerprint = $this->meta($productId, self::EN_CONTENT_FINGERPRINT_META);
              $preparedEnglishIsCurrent = $preparedTargetFingerprint !== ''
                  && $preparedEnglishFingerprint !== ''
                  && hash_equals($preparedEnglishFingerprint, $this->englishFingerprint($current));

              if (
                  $preparedEnglishIsCurrent
                  && ! hash_equals($preparedTargetFingerprint, $this->ruFingerprint($generated))
              ) {
                  $stalePreparedEnglish = true;
                  if (is_array($legacy)) {
                      $legacyWithoutEnglish = $legacy;
                      foreach (['enShort', 'enLong', 'enMeta'] as $field) {
                          $legacyWithoutEnglish[$field] = '';
                      }
                      $generated = $this->builder->build(
                          $baseTitle,
                          $developer,
                          $productType,
                          $signals,
                          $sourceUpdateDate,
                          $this->enrichLegacy($legacyWithoutEnglish, $official, $generic)
                      );
                      $generated = $this->preserveQualityMeta($legacyWithoutEnglish, $generated);
                      $generated = $this->preserveRichLegacyRu($legacyWithoutEnglish, $generated);
                  }
              }

          '''
          if '$stalePreparedEnglish = false;' not in s:
              needle = '        $translationIssue = $this->translationIssue($generated);\n'
              if needle not in s:
                  raise SystemExit('translationIssue anchor missing')
              s = s.replace(needle, stale_block + needle, 1)

          old = """        $translationRequired = (is_array($legacy)
                  && $this->requiresEnglishTranslation($legacy))
                  || $translationIssue !== '';
          """
          new = """        $translationRequired = $stalePreparedEnglish
                  || (is_array($legacy) && $this->requiresEnglishTranslation($legacy))
                  || $translationIssue !== '';
          """
          if old in s:
              s = s.replace(old, new, 1)

          if 'private function ruFingerprint(' not in s:
              needle = '    private function syncTranslatePress(int $productId, array $content): array\n'
              if needle not in s:
                  raise SystemExit('sync function anchor missing')
              helpers = r'''    /**
               * @param array{ruShort:string,ruLong:string,ruMeta:string,enShort:string,enLong:string,enMeta:string} $content
               */
              private function ruFingerprint(array $content): string
              {
                  return hash('sha256', $content['ruShort'] . "\0" . $content['ruLong'] . "\0" . $content['ruMeta']);
              }

              /**
               * @param array{ruShort:string,ruLong:string,ruMeta:string,enShort:string,enLong:string,enMeta:string} $content
               */
              private function englishFingerprint(array $content): string
              {
                  return hash('sha256', $content['enShort'] . "\0" . $content['enLong'] . "\0" . $content['enMeta']);
              }

          '''
              s = s.replace(needle, helpers + needle, 1)

          if "delete_post_meta', $productId, self::EN_TARGET_RU_FINGERPRINT_META" not in s:
              needle = "        ($this->call)('delete_post_meta', $productId, self::MIGRATED_AT_META);\n"
              if needle not in s:
                  raise SystemExit('restore anchor missing')
              s = s.replace(
                  needle,
                  needle
                  + "        ($this->call)('delete_post_meta', $productId, self::EN_TARGET_RU_FINGERPRINT_META);\n"
                  + "        ($this->call)('delete_post_meta', $productId, self::EN_CONTENT_FINGERPRINT_META);\n",
                  1,
              )
          sp.write_text(s)

          pp = Path('apps/Plugin/Admin/ProductEditorialMigrationPage.php')
          p = pp.read_text()
          if 'EN_TARGET_RU_FINGERPRINT_META' not in p:
              p = p.replace(
                  "    private const PACK_VERSION = '2';\n",
                  "    private const PACK_VERSION = '2';\n"
                  "    private const EN_TARGET_RU_FINGERPRINT_META = '_wp_shop_en_target_ru_fingerprint_v2';\n"
                  "    private const EN_CONTENT_FINGERPRINT_META = '_wp_shop_en_content_fingerprint_v2';\n",
                  1,
              )

          old_prepared = "            $prepared[] = ['id' => $id, 'short' => $enShort, 'long' => $enLong, 'meta' => $enMeta];\n"
          if old_prepared in p:
              p = p.replace(old_prepared, """            $prepared[] = [
                  'id' => $id,
                  'short' => $enShort,
                  'long' => $enLong,
                  'meta' => $enMeta,
                  'targetFingerprint' => trim((string) ($row['Target RU Fingerprint'] ?? '')),
              ];
          """, 1)

          pattern = re.compile(
              r"        foreach \(\$prepared as \$item\) \{\n"
              r"            \$id = \$item\['id'\];\n"
              r"            \(\$this->call\)\('update_post_meta', \$id, '_wp_shop_en_short_description',[\s\S]*?"
              r"            \$logs\[\] = 'PRODUCT ' \. \$id \. ' = TARGET EN PREPARED / OVERALL ' \. \$post\['status'\];\n"
              r"        \}\n",
              re.M,
          )
          if 'self::EN_CONTENT_FINGERPRINT_META' not in p:
              m = pattern.search(p)
              if not m:
                  raise SystemExit('import write loop missing')
              repl = r'''        foreach ($prepared as $item) {
                  $id = $item['id'];
                  $short = (string) ($this->call)('wp_kses_post', $item['short']);
                  $long = (string) ($this->call)('wp_kses_post', $item['long']);
                  $meta = (string) ($this->call)('sanitize_textarea_field', $item['meta']);
                  ($this->call)('update_post_meta', $id, '_wp_shop_en_short_description', $short);
                  ($this->call)('update_post_meta', $id, '_wp_shop_en_long_description', $long);
                  ($this->call)('update_post_meta', $id, '_wp_shop_en_meta_description', $meta);
                  ($this->call)('update_post_meta', $id, self::EN_TARGET_RU_FINGERPRINT_META, $item['targetFingerprint']);
                  ($this->call)(
                      'update_post_meta',
                      $id,
                      self::EN_CONTENT_FINGERPRINT_META,
                      $this->englishFingerprint($short, $long, $meta)
                  );
                  $post = $this->previewForPack($id);
                  $logs[] = 'PRODUCT ' . $id . ' = TARGET EN PREPARED / OVERALL ' . $post['status'];
              }
          '''
              p = p[:m.start()] + repl + p[m.end():]

          if 'private function englishFingerprint(string $short' not in p:
              needle = '    private function packEligible(array $preview): bool\n'
              if needle not in p:
                  raise SystemExit('packEligible anchor missing')
              helper = r'''    private function englishFingerprint(string $short, string $long, string $meta): string
              {
                  return hash('sha256', $short . "\0" . $long . "\0" . $meta);
              }

          '''
              p = p.replace(needle, helper + needle, 1)
          pp.write_text(p)

          tp = Path('tests/App/Plugin/ProductManager/Editorial/ProductEditorialEnTargetProvenanceTest.php')
          tp.write_text(textwrap.dedent(r'''<?php

          declare(strict_types=1);

          namespace WPShop\Tests\App\Plugin\ProductManager\Editorial;

          use PHPUnit\Framework\TestCase;
          use WPShop\App\Plugin\ProductManager\Editorial\ProductEditorialMigrationService;

          final class ProductEditorialEnTargetProvenanceTest extends TestCase
          {
              public function testStalePreparedEnglishStopsMigrationAfterRuTargetChanges(): void
              {
                  $ru = 'WP Reset PRO — профессиональный плагин для быстрого сброса базы данных WordPress. '
                      . 'Идеален для разработчиков и тестировщиков.';
                  $enShort = '<p>WP Reset PRO is a professional WordPress reset plugin.</p>';
                  $enLong = '<h2>WP Reset PRO</h2><p>WP Reset PRO is a professional WordPress reset plugin.</p>'
                      . '<p>WP Reset PRO is suitable for quickly resetting a WordPress database.</p>';
                  $enMeta = 'Professional WordPress reset plugin for database reset workflows.';
                  $post = [
                      'ID' => 2956,
                      'post_type' => 'product',
                      'post_title' => 'WP Reset PRO - WordPress Development Tool for Non-Devs 6.18',
                      'post_excerpt' => $ru,
                      'post_content' => $ru,
                  ];
                  $meta = [
                      'attr_version_value' => '6.18',
                      '_wp_shop_product_type' => 'plugin',
                      'attr_developer_value' => 'WebFactory Ltd',
                      '_wp_shop_source_update_date' => '',
                      '_wp_shop_en_short_description' => $enShort,
                      '_wp_shop_en_long_description' => $enLong,
                      '_wp_shop_en_meta_description' => $enMeta,
                      '_wp_shop_en_target_ru_fingerprint_v2' => str_repeat('a', 64),
                      '_wp_shop_en_content_fingerprint_v2' => hash(
                          'sha256',
                          $enShort . "\0" . $enLong . "\0" . $enMeta
                      ),
                      'surerank_settings_general' => ['page_description' => $ru],
                  ];
                  $service = new ProductEditorialMigrationService($this->caller($post, $meta));
                  $preview = $service->preview(2956);
                  self::assertSame('STOP', $preview['status']);
                  self::assertSame('REVIEW', $preview['enStatus']);
                  self::assertStringContainsString(
                      'WP Reset PRO подходит для разработчиков и тестировщиков.',
                      $preview['generated']['ruLong']
                  );
                  self::assertStringNotContainsString(
                      'is suitable for quickly resetting a WordPress database',
                      $preview['generated']['enLong']
                  );
              }

              /**
               * @param array<string,mixed> $post
               * @param array<string,mixed> $meta
               * @return \Closure(string,mixed...): mixed
               */
              private function caller(array &$post, array &$meta): \Closure
              {
                  return static function (string $name, mixed ...$arguments) use (&$post, &$meta): mixed {
                      if ($name === 'get_post') {
                          return (object) $post;
                      }
                      if ($name === 'get_post_meta') {
                          return $meta[(string) $arguments[1]] ?? '';
                      }
                      if ($name === 'wp_get_post_terms') {
                          return [];
                      }
                      if ($name === 'current_time') {
                          return '2026-08-31 12:00:00';
                      }
                      return null;
                  };
              }
          }
          '''))
          PY

          git rm .github/workflows/one-shot-en-target-provenance-v2.yml
          git config user.name "wp-shop-builder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php apps/Plugin/Admin/ProductEditorialMigrationPage.php tests/App/Plugin/ProductManager/Editorial/ProductEditorialEnTargetProvenanceTest.php
          git commit -m "fix: invalidate stale prepared EN when RU target changes"
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
