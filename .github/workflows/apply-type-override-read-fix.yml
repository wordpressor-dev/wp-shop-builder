name: Apply technical type override read repair

on:
  push:
    branches:
      - feature/product-manager-v28-catalog-editorial-migration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/product-manager-v28-catalog-editorial-migration
          fetch-depth: 0

      - name: Apply repair and push
        shell: bash
        run: |
          set -euo pipefail
          python .github/fix-type-override-read.py
          php -l apps/Plugin/ProductManager/WordPress/WordPressFunctionCaller.php
          php -l apps/Plugin/ProductManager/Editorial/ProductEditorialMigrationService.php
          php -l tests/App/Plugin/ProductManager/Editorial/ProductTechnicalTypeOverrideTest.php
          rm -f .github/fix-type-override-read.py
          rm -f .github/type-override-trigger.txt
          rm -f .github/workflows/apply-type-override-read-fix.yml
          git config user.name 'wordpressor-dev'
          git config user.email 'serghei.colos@gmail.com'
          git add -A
          git commit -m 'fix: make manual technical type override authoritative'
          git push origin HEAD:feature/product-manager-v28-catalog-editorial-migration
